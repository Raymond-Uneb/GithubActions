name: CI Pipeline - Build and Test Spring Boot

on:
  push:
    branches: [testes]
  pull_request:
    branches: [testes]

env:
  JAVA_VERSION: '21'
  POSTGRES_VERSION: '18'

jobs:
  # Job principal: a Build e Teste no ubuntu
  build:
    name:  Build & Test
    runs-on: ubuntu-latest

    # Serviço do PostgreSQL para os testes de integração
    services:
      postgres:
        image: postgres:${{ env.POSTGRES_VERSION }}
        env:
          POSTGRES_DB: testdb
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      # 1. Checkout do suposto código
      - name:  Checkout code
        uses: actions/checkout@v4

      # 2. Configurar JDK
      - name:  Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'maven'

      # 3. Cache do Maven (só pra acelerar mesmo, builds futuras)
      - name:  Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      # 4. Configurar variáveis de ambiente para o PostgreSQL
      - name:  Configure PostgreSQL connection
        run: |
          echo "SPRING_DATASOURCE_URL=jdbc:postgresql://localhost:5432/testdb" >> $GITHUB_ENV
          echo "SPRING_DATASOURCE_USERNAME=testuser" >> $GITHUB_ENV
          echo "SPRING_DATASOURCE_PASSWORD=testpass" >> $GITHUB_ENV

      # 5. Rodar testes (inclui suposta integração com PostgreSQL)
      - name:  Run tests
        run: mvn clean test
        env:
          SPRING_PROFILES_ACTIVE: test

      # 6. Build do projeto (gera o suopsto JAR)
      - name:  Build Spring Boot JAR
        run: mvn clean package -DskipTests

      # 7. Upload do JAR como artifact, eu acho...
      - name:  Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: spring-boot-app-jar
          path: target/*.jar
          retention-days: 30
          if-no-files-found: error

      # 8. Upload dos resultados dos testes (era pra facilita debug né..)
      - name:  Upload test results
        uses: actions/upload-artifact@v4
        if: always()  # Upload mesmo se os testes falharem
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          retention-days: 14
